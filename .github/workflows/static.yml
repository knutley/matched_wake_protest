name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render slides
        run: quarto render presentation/talk.qmd

      - name: Collect site (presentation folder only)
        run: |
          mkdir -p _site
          cp presentation/index.html presentation/talk.html _site/
          cp -r presentation/talk_files _site/ 2>/dev/null || true
          cp -r presentation/figures _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
